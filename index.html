<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盛祥工資表系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        }
        /* 平滑水平捲動 */
        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-900 font-sans">

    <!-- 登入頁面 -->
    <div id="login-section" class="flex justify-center items-center min-h-screen px-4">
        <div class="bg-white border border-gray-300 p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-black mb-2 tracking-wide">盛祥工資表系統</h1>
            <p class="text-xs text-center text-gray-500 mb-6">請選擇身分並登入</p>

            <div class="flex border-b border-gray-200 mb-6">
                <button type="button" id="tab-emp" onclick="switchLoginTab('employee')" class="flex-1 py-2 font-medium text-center border-b-2 border-black text-black">員工登入</button>
                <button type="button" id="tab-admin" onclick="switchLoginTab('admin')" class="flex-1 py-2 font-medium text-center text-gray-400 hover:text-black">管理者登入</button>
            </div>

            <!-- 員工登入表單 -->
            <div id="emp-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">身分證字號</label>
                    <input type="text" id="emp-id" placeholder="例如: A123456789" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-black uppercase">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密碼 (西元生日 8 碼)</label>
                    <input type="password" id="emp-dob" placeholder="例如: 19900101" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-black">
                </div>
                <button onclick="handleLogin('employee')" class="w-full bg-black hover:bg-gray-800 text-white font-medium py-2 rounded transition">
                    登入
                </button>
            </div>

            <!-- 管理者登入表單 -->
            <div id="admin-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">管理者帳號</label>
                    <input type="text" id="admin-acc" value="admin" readonly class="w-full px-3 py-2 border border-gray-200 bg-gray-50 text-gray-500 rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">管理者密碼</label>
                    <input type="password" id="admin-pwd" placeholder="預設: admin123" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-black">
                </div>
                <button onclick="handleLogin('admin')" class="w-full bg-black hover:bg-gray-800 text-white font-medium py-2 rounded transition">
                    登入
                </button>
            </div>
        </div>
    </div>

    <!-- 主控台頁面 -->
    <div id="app-section" class="hidden min-h-screen flex flex-col">
        <!-- 頂部導覽列 -->
        <header class="bg-black text-white px-6 py-4 flex justify-between items-center shadow">
            <div class="flex items-center gap-3">
                <span class="font-bold text-lg tracking-wide">盛祥工資表系統</span>
                <span id="role-badge" class="text-xs bg-gray-700 px-2 py-0.5 rounded text-gray-200"></span>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-sm font-medium text-gray-300"></span>
                <button onclick="handleLogout()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-600 px-3 py-1.5 rounded transition">
                    登出
                </button>
            </div>
        </header>

        <!-- 主內容區 -->
        <main class="flex-1 container mx-auto p-4 md:p-6 max-w-6xl">

            <!-- 管理者切換檢視與導出控制列 -->
            <div id="admin-controls" class="hidden bg-white border border-gray-200 rounded-lg p-4 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-sm">
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <label class="text-sm font-bold text-gray-700 whitespace-nowrap">選擇查看人員：</label>
                    <select id="admin-user-select" onchange="onAdminSelectUser()" class="border border-gray-300 rounded px-3 py-1.5 text-sm w-full md:w-auto focus:outline-none focus:border-black">
                        <!-- 動態填充員工選項 -->
                    </select>
                </div>
                <button onclick="exportToExcel()" class="w-full md:w-auto bg-gray-900 hover:bg-gray-700 text-white text-sm font-medium px-4 py-2 rounded flex items-center justify-center gap-2 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    匯出 Excel 薪資表 (.xlsx)
                </button>
            </div>

            <!-- 工時紀錄表單卡片 -->
            <div class="bg-white border border-gray-200 rounded-lg p-5 mb-6 shadow-sm">
                <h2 class="text-base font-bold text-black border-b border-gray-200 pb-2 mb-4 flex justify-between items-center">
                    <span>工時與出勤登記 (<span id="target-user-name"></span>)</span>
                    <span id="rate-info" class="text-xs font-normal text-gray-500"></span>
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-4">
                    <!-- 年月份與日期選擇 -->
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">日期</label>
                        <div class="flex gap-1">
                            <select id="entry-year" onchange="updateDaysInMonth()" class="border border-gray-300 rounded px-2 py-1.5 text-sm w-1/3 focus:outline-none focus:border-black"></select>
                            <select id="entry-month" onchange="updateDaysInMonth()" class="border border-gray-300 rounded px-2 py-1.5 text-sm w-1/3 focus:outline-none focus:border-black"></select>
                            <select id="entry-day" class="border border-gray-300 rounded px-2 py-1.5 text-sm w-1/3 focus:outline-none focus:border-black"></select>
                        </div>
                    </div>

                    <!-- 工地選擇 -->
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">工地名稱</label>
                        <select id="entry-site" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-black">
                            <option value="F18P9">F18P9</option>
                            <option value="F18P10">F18P10</option>
                            <option value="F22P4">F22P4</option>
                            <option value="F22P5">F22P5</option>
                            <option value="休息/未出勤">休息/未出勤</option>
                        </select>
                    </div>

                    <!-- 出勤類型 -->
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">出勤類型</label>
                        <select id="entry-type" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-black">
                            <option value="一天">一天</option>
                            <option value="半天">半天</option>
                        </select>
                    </div>

                    <!-- 24小時制離場時間選單 -->
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">離場時間 (24小時制)</label>
                        <select id="entry-time" class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-black">
                            <!-- 00:00 - 23:30 動態產生 -->
                        </select>
                    </div>

                    <!-- 提交按鈕 -->
                    <div class="flex items-end">
                        <button onclick="addLogRecord()" class="w-full bg-black hover:bg-gray-800 text-white font-medium py-1.5 px-4 rounded text-sm transition">
                            + 新增紀錄
                        </button>
                    </div>
                </div>
            </div>

            <!-- 出勤明細表格 -->
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden mb-6">
                <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h3 class="font-bold text-sm text-gray-800">月度出勤與薪資明細</h3>
                    <div class="text-xs text-gray-500">
                        顯示月份：<select id="filter-month" onchange="renderLogs()" class="border border-gray-300 rounded px-2 py-1 bg-white focus:outline-none focus:border-black"></select>
                    </div>
                </div>

                <div class="overflow-x-auto smooth-scroll">
                    <table class="w-full text-left text-sm text-gray-700">
                        <thead class="bg-gray-100 text-gray-600 border-b border-gray-200 text-xs uppercase">
                            <tr>
                                <th class="py-3 px-4">日期</th>
                                <th class="py-3 px-4">工地名稱</th>
                                <th class="py-3 px-4">出勤類型</th>
                                <th class="py-3 px-4">離場時間</th>
                                <th class="py-3 px-4 text-right">當日薪資 (元)</th>
                                <th class="py-3 px-4 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="log-table-body" class="divide-y divide-gray-200">
                            <!-- 動態填入 -->
                        </tbody>
                    </table>
                </div>

                <!-- 薪資小計統計列 -->
                <div class="p-4 bg-gray-50 border-t border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-2">
                    <span class="text-xs text-gray-500">* 當月薪資總計全額發放（無扣除額）</span>
                    <div class="text-right">
                        <span class="text-xs text-gray-600 mr-2">當月應付總額：</span>
                        <span id="monthly-total" class="text-lg font-bold text-black">$0</span>
                    </div>
                </div>
            </div>

            <!-- 管理者專屬：全體總表概覽 -->
            <div id="admin-summary-section" class="hidden bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden mb-6">
                <div class="p-4 border-b border-gray-200 bg-gray-100">
                    <h3 class="font-bold text-sm text-black">全體員工全月薪資總表</h3>
                </div>
                <div class="overflow-x-auto smooth-scroll">
                    <table id="admin-excel-table" class="w-full text-left text-sm text-gray-700">
                        <thead class="bg-gray-50 text-gray-600 border-b border-gray-200 text-xs">
                            <tr>
                                <th class="py-3 px-4 border-r">員工姓名</th>
                                <th class="py-3 px-4 border-r">全天天數</th>
                                <th class="py-3 px-4 border-r">半天天數</th>
                                <th class="py-3 px-4 border-r">日薪/加班金</th>
                                <th class="py-3 px-4 text-right">應付總額 (元)</th>
                            </tr>
                        </thead>
                        <tbody id="admin-summary-body" class="divide-y divide-gray-200">
                            <!-- 動態寫入 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script>
        // 預設 18 位員工資料資料庫
        const EMPLOYEES = [
            { id: "A123456789", dob: "19880101", name: "吳睿鈞", baseRate: 2800, otRate: 300 },
            { id: "B123456789", dob: "19900202", name: "徐朝恩", baseRate: 2000, otRate: 200 },
            { id: "C123456789", dob: "19850303", name: "陳俊傑", baseRate: 1800, otRate: 200 },
            { id: "D123456789", dob: "19920404", name: "黃丞伯", baseRate: 1800, otRate: 150 },
            { id: "E123456789", dob: "19870505", name: "柯君翰", baseRate: 2500, otRate: 250 },
            { id: "F123456789", dob: "19890606", name: "康家豪粉光", baseRate: 2800, otRate: 300 },
            { id: "G123456789", dob: "19910707", name: "康家豪EPOXY", baseRate: 2500, otRate: 250 },
            { id: "H123456789", dob: "19860808", name: "張天寶", baseRate: 2000, otRate: 200 },
            { id: "I123456789", dob: "19930909", name: "陳見宜", baseRate: 1800, otRate: 200 },
            { id: "J123456789", dob: "19841010", name: "陳培恩", baseRate: 1800, otRate: 150 },
            { id: "K123456789", dob: "19951111", name: "謝佳龍", baseRate: 2800, otRate: 300 },
            { id: "L123456789", dob: "19961212", name: "謝琮欽", baseRate: 2500, otRate: 250 },
            { id: "M123456789", dob: "19830115", name: "曹益彰", baseRate: 2000, otRate: 200 },
            { id: "N123456789", dob: "19940218", name: "吳玲姿", baseRate: 1800, otRate: 200 },
            { id: "O123456789", dob: "19870320", name: "吳秋慧", baseRate: 1800, otRate: 150 },
            { id: "P123456789", dob: "19920422", name: "吳明宸", baseRate: 2500, otRate: 250 },
            { id: "Q123456789", dob: "19890525", name: "劉世瑋", baseRate: 2800, otRate: 300 },
            { id: "R123456789", dob: "19910630", name: "莊偉政", baseRate: 2000, otRate: 200 }
        ];

        let currentSession = null; // { role: 'admin'|'employee', user: Object }
        let activeViewUser = null; // 當前表單操作的目標員工

        // 初始化頁面
        window.addEventListener('DOMContentLoaded', () => {
            initTimeDropdown();
            initDateDropdowns();
            populateAdminDropdown();
        });

        // 登入 Tab 切換
        function switchLoginTab(role) {
            const empTab = document.getElementById('tab-emp');
            const adminTab = document.getElementById('tab-admin');
            const empForm = document.getElementById('emp-form');
            const adminForm = document.getElementById('admin-form');

            if (role === 'employee') {
                empTab.className = "flex-1 py-2 font-medium text-center border-b-2 border-black text-black";
                adminTab.className = "flex-1 py-2 font-medium text-center text-gray-400 hover:text-black";
                empForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            } else {
                adminTab.className = "flex-1 py-2 font-medium text-center border-b-2 border-black text-black";
                empTab.className = "flex-1 py-2 font-medium text-center text-gray-400 hover:text-black";
                adminForm.classList.remove('hidden');
                empForm.classList.add('hidden');
            }
        }

        // 登入處理
        function handleLogin(role) {
            if (role === 'employee') {
                const idInput = document.getElementById('emp-id').value.trim().toUpperCase();
                const dobInput = document.getElementById('emp-dob').value.trim();

                const target = EMPLOYEES.find(e => e.id === idInput && e.dob === dobInput);
                if (!target) {
                    alert("身分證字號或生日密碼不正確！");
                    return;
                }
                currentSession = { role: 'employee', user: target };
                activeViewUser = target;
            } else {
                const pwd = document.getElementById('admin-pwd').value.trim();
                if (pwd !== 'admin123') {
                    alert("管理者密碼錯誤！");
                    return;
                }
                currentSession = { role: 'admin', user: { name: "系統管理者" } };
                activeViewUser = EMPLOYEES[0]; // 預設選第一位
            }

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            setupUI();
        }

        // 登出
        function handleLogout() {
            currentSession = null;
            activeViewUser = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('emp-id').value = '';
            document.getElementById('emp-dob').value = '';
            document.getElementById('admin-pwd').value = '';
        }

        // 設定主畫面UI
        function setupUI() {
            document.getElementById('user-display').innerText = currentSession.user.name;
            const badge = document.getElementById('role-badge');
            
            if (currentSession.role === 'admin') {
                badge.innerText = "管理者";
                document.getElementById('admin-controls').classList.remove('hidden');
                document.getElementById('admin-summary-section').classList.remove('hidden');
                document.getElementById('admin-user-select').value = activeViewUser.id;
            } else {
                badge.innerText = "一般員工";
                document.getElementById('admin-controls').classList.add('hidden');
                document.getElementById('admin-summary-section').classList.add('hidden');
            }

            updateTargetUserInfo();
            renderLogs();
            if (currentSession.role === 'admin') {
                renderAdminSummary();
            }
        }

        // 管理者切換員工
        function onAdminSelectUser() {
            const selectedId = document.getElementById('admin-user-select').value;
            activeViewUser = EMPLOYEES.find(e => e.id === selectedId);
            updateTargetUserInfo();
            renderLogs();
        }

        function updateTargetUserInfo() {
            document.getElementById('target-user-name').innerText = activeViewUser.name;
            document.getElementById('rate-info').innerText = `日薪: $${activeViewUser.baseRate} / 加班: $${activeViewUser.otRate}`;
        }

        // 初始化日期選單 (2026 年起)
        function initDateDropdowns() {
            const yearSelect = document.getElementById('entry-year');
            const monthSelect = document.getElementById('entry-month');
            const filterMonth = document.getElementById('filter-month');
            
            const currentYear = 2026;
            for (let y = currentYear; y <= currentYear + 10; y++) {
                yearSelect.add(new Option(`${y}年`, y));
            }

            filterMonth.add(new Option("全部顯示", "ALL"));
            for (let m = 1; m <= 12; m++) {
                const mStr = m.toString().padStart(2, '0');
                monthSelect.add(new Option(`${mStr}月`, mStr));
                filterMonth.add(new Option(`${mStr}月`, mStr));
            }

            // 預設當月
            const today = new Date();
            monthSelect.value = (today.getMonth() + 1).toString().padStart(2, '0');
            updateDaysInMonth();
        }

        function updateDaysInMonth() {
            const year = parseInt(document.getElementById('entry-year').value);
            const month = parseInt(document.getElementById('entry-month').value);
            const daySelect = document.getElementById('entry-day');
            
            daySelect.innerHTML = '';
            const daysInMonth = new Date(year, month, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const dStr = d.toString().padStart(2, '0');
                daySelect.add(new Option(`${dStr}日`, dStr));
            }
        }

        // 初始化 24 小時制時間選單 (00:00 - 23:30)
        function initTimeDropdown() {
            const timeSelect = document.getElementById('entry-time');
            for (let h = 0; h < 24; h++) {
                for (let m of ['00', '30']) {
                    const hStr = h.toString().padStart(2, '0');
                    const timeStr = `${hStr}:${m}`;
                    timeSelect.add(new Option(timeStr, timeStr));
                }
            }
            timeSelect.value = "17:00"; // 預設下班時間
        }

        // 填入管理者專用下拉式選單
        function populateAdminDropdown() {
            const select = document.getElementById('admin-user-select');
            select.innerHTML = '';
            EMPLOYEES.forEach(emp => {
                select.add(new Option(`${emp.name} (${emp.id})`, emp.id));
            });
        }

        // localStorage 資料存取
        function getAllLogs() {
            return JSON.parse(localStorage.getItem('shengxiang_work_logs') || '[]');
        }

        function saveAllLogs(logs) {
            localStorage.setItem('shengxiang_work_logs', JSON.stringify(logs));
        }

        // 新增出勤紀錄
        function addLogRecord() {
            const year = document.getElementById('entry-year').value;
            const month = document.getElementById('entry-month').value;
            const day = document.getElementById('entry-day').value;
            const dateStr = `${year}-${month}-${day}`;
            const site = document.getElementById('entry-site').value;
            const type = document.getElementById('entry-type').value;
            const time = document.getElementById('entry-time').value;

            // 計算當日薪資
            let dailyPay = 0;
            if (site !== '休息/未出勤') {
                dailyPay = (type === '一天') ? activeViewUser.baseRate : (activeViewUser.baseRate / 2);
            }

            const newRecord = {
                id: Date.now(),
                empId: activeViewUser.id,
                empName: activeViewUser.name,
                date: dateStr,
                month: month,
                site: site,
                type: type,
                time: time,
                pay: dailyPay
            };

            const logs = getAllLogs();
            logs.push(newRecord);
            saveAllLogs(logs);

            renderLogs();
            if (currentSession.role === 'admin') renderAdminSummary();
        }

        // 刪除紀錄
        function deleteRecord(id) {
            if (!confirm("確定要刪除這筆出勤紀錄嗎？")) return;
            let logs = getAllLogs();
            logs = logs.filter(item => item.id !== id);
            saveAllLogs(logs);
            renderLogs();
            if (currentSession.role === 'admin') renderAdminSummary();
        }

        // 渲染員工個人明細表格
        function renderLogs() {
            const logs = getAllLogs().filter(l => l.empId === activeViewUser.id);
            const filterMonth = document.getElementById('filter-month').value;
            const tbody = document.getElementById('log-table-body');
            tbody.innerHTML = '';

            let filteredLogs = logs;
            if (filterMonth !== 'ALL') {
                filteredLogs = logs.filter(l => l.date.split('-')[1] === filterMonth);
            }

            let monthlyTotal = 0;

            filteredLogs.forEach(log => {
                monthlyTotal += log.pay;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="py-2.5 px-4 font-mono">${log.date}</td>
                    <td class="py-2.5 px-4 font-medium">${log.site}</td>
                    <td class="py-2.5 px-4">${log.type}</td>
                    <td class="py-2.5 px-4 font-mono">${log.time}</td>
                    <td class="py-2.5 px-4 text-right font-bold text-black">$${log.pay.toLocaleString()}</td>
                    <td class="py-2.5 px-4 text-center">
                        <button onclick="deleteRecord(${log.id})" class="text-xs text-red-600 hover:text-red-800 underline">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('monthly-total').innerText = `$${monthlyTotal.toLocaleString()}`;
        }

        // 渲染管理者全體總表
        function renderAdminSummary() {
            const logs = getAllLogs();
            const tbody = document.getElementById('admin-summary-body');
            tbody.innerHTML = '';

            EMPLOYEES.forEach(emp => {
                const userLogs = logs.filter(l => l.empId === emp.id);
                let fullDays = 0;
                let halfDays = 0;
                let totalPay = 0;

                userLogs.forEach(l => {
                    if (l.site !== '休息/未出勤') {
                        if (l.type === '一天') fullDays++;
                        else if (l.type === '半天') halfDays++;
                    }
                    totalPay += l.pay;
                });

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="py-3 px-4 border-r font-bold">${emp.name}</td>
                    <td class="py-3 px-4 border-r">${fullDays} 天</td>
                    <td class="py-3 px-4 border-r">${halfDays} 天</td>
                    <td class="py-3 px-4 border-r text-xs text-gray-500">$${emp.baseRate} / $${emp.otRate}</td>
                    <td class="py-3 px-4 text-right font-bold text-black">$${totalPay.toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 匯出 Excel (無底部帳號資訊)
        function exportToExcel() {
            const table = document.getElementById('admin-excel-table');
            const wb = XLSX.utils.table_to_book(table, { sheet: "全體薪資總表" });
            XLSX.writeFile(wb, "盛祥工資表總彙整.xlsx");
        }
    </script>
</body>
</html>
